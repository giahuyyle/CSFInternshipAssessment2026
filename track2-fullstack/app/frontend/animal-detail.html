<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <a href="animals.html" class="back-link">← Back to Animals</a>
    <div id="animal-detail"><p class="loading">Loading…</p></div>

    <section id="health-section" style="display:none">
      <h3>Health Events</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Vet</th><th>Notes</th></tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>

      <h4>Log Health Event</h4>
      <form id="event-form">
        <label>Type
          <select name="event_type" required>
            <option value="vaccination">Vaccination</option>
            <option value="checkup">Checkup</option>
            <option value="treatment">Treatment</option>
            <option value="injury">Injury</option>
          </select>
        </label>
        <label>Date <input type="date" name="date" required></label>
        <label>Vet <input type="text" name="vet_name" placeholder="Optional"></label>
        <label>Notes <input type="text" name="notes" placeholder="Optional"></label>
        <button type="submit">Log Event</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get('id');

    function showMessage(container, message, className = 'empty') {
      container.replaceChildren();
      const element = document.createElement('p');
      element.className = className;
      element.textContent = message;
      container.appendChild(element);
    }

    function showTableMessage(tbody, message, className = 'empty') {
      tbody.replaceChildren();
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 4;
      cell.className = className;
      cell.textContent = message;
      row.appendChild(cell);
      tbody.appendChild(row);
    }

    function appendDetail(dl, label, value) {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value;
      dl.append(dt, dd);
    }

    async function load() {
      const detail = document.getElementById('animal-detail');
      const eventsBody = document.getElementById('events-body');
      try {
        const [animal, paddocks] = await Promise.all([
          api.get(`/animals/${animalId}`),
          api.get('/paddocks'),
        ]);
        const paddock = paddocks.find(p => p.id === animal.paddock_id);

        document.title = `${animal.name} — FarmTracker`;
        detail.replaceChildren();

        const header = document.createElement('div');
        header.className = 'animal-header';
        const heading = document.createElement('h2');
        heading.textContent = animal.name;
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = animal.tag_number;
        heading.appendChild(tag);
        header.appendChild(heading);

        const dl = document.createElement('dl');
        appendDetail(dl, 'Breed', animal.breed ?? '—');
        appendDetail(dl, 'Date of Birth', animal.date_of_birth ?? '—');
        appendDetail(dl, 'Paddock', paddock ? paddock.name : 'Unassigned');

        detail.append(header, dl);

        document.getElementById('health-section').style.display = 'block';
        await loadEvents();
      } catch (err) {
        showMessage(detail, 'Unable to load animal details. Please try again.', 'error');
        showTableMessage(eventsBody, 'Unable to load health events.', 'error');
      }
    }

    async function loadEvents() {
      const tbody = document.getElementById('events-body');
      try {
        const events = await api.get(`/animals/${animalId}/health-events`);
        if (!events.length) {
          showTableMessage(tbody, 'No events recorded.');
          return;
        }

        tbody.replaceChildren();
        events.forEach(e => {
          const row = document.createElement('tr');
          [e.date, e.event_type, e.vet_name ?? '—', e.notes ?? '—'].forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.appendChild(cell);
          });
          tbody.appendChild(row);
        });
      } catch (err) {
        showTableMessage(tbody, 'Unable to load health events.', 'error');
      }
    }

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      try {
        await api.post(`/animals/${animalId}/health-events`, data);
        e.target.reset();
        await loadEvents();
      } catch (err) {
        showTableMessage(document.getElementById('events-body'), 'Unable to save health event. Please try again.', 'error');
      }
    });

    load();
  </script>
</body>
</html>
