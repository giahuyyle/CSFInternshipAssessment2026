<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animals — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Animals</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tag</th>
          <th>Name</th>
          <th>Breed</th>
          <th>Paddock</th>
          <th>Latest Health Event</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="animals-body">
        <tr><td colspan="6" class="loading">Loading…</td></tr>
      </tbody>
    </table>
    <div class="pagination">
      <button id="prev-btn" onclick="changePage(-1)" disabled>Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    let currentPage = 0;
    const LIMIT = 5;

    function showTableMessage(tbody, message, className = 'empty') {
      tbody.replaceChildren();
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 6;
      cell.className = className;
      cell.textContent = message;
      row.appendChild(cell);
      tbody.appendChild(row);
    }

    function paddockNameById(paddocks) {
      return new Map(paddocks.map(paddock => [paddock.id, paddock.name]));
    }

    async function loadAnimals() {
      const tbody = document.getElementById('animals-body');
      try {
        const [animals, paddocks] = await Promise.all([
          api.get(`/animals?page=${currentPage}&limit=${LIMIT}`),
          api.get('/paddocks'),
        ]);
        const paddockNames = paddockNameById(paddocks);

        if (!animals.length) {
          showTableMessage(tbody, 'No animals found.');
          document.getElementById('next-btn').disabled = true;
          return;
        }

        tbody.replaceChildren();
        animals.forEach(a => {
          const row = document.createElement('tr');
          const event = a.latest_health_event
            ? `${a.latest_health_event.event_type} (${a.latest_health_event.date})`
            : '—';
          const values = [
            a.tag_number,
            a.name,
            a.breed ?? '—',
            a.paddock_id ? paddockNames.get(a.paddock_id) ?? `Paddock ${a.paddock_id}` : '—',
            event,
          ];

          values.forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.appendChild(cell);
          });

          const actionCell = document.createElement('td');
          const link = document.createElement('a');
          link.href = `animal-detail.html?id=${a.id}`;
          link.textContent = 'View';
          actionCell.appendChild(link);
          row.appendChild(actionCell);

          tbody.appendChild(row);
        });

        document.getElementById('page-info').textContent = `Page ${currentPage + 1}`;
        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = animals.length < LIMIT;
      } catch (err) {
        showTableMessage(tbody, 'Unable to load animals. Please try again.', 'error');
      }
    }

    function changePage(dir) {
      currentPage = Math.max(0, currentPage + dir);
      loadAnimals();
    }

    loadAnimals();
  </script>
</body>
</html>
