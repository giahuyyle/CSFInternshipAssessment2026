<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html" class="active">Paddocks</a>
      <a href="animals.html">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Paddocks</h2>
    </div>
    <div id="paddocks-grid" class="card-grid">
      <p class="loading">Loading…</p>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    async function loadPaddocks() {
      const grid = document.getElementById('paddocks-grid');
      try {
        const paddocks = await api.get('/paddocks');
        grid.replaceChildren();

        if (!paddocks.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No paddocks found.';
          grid.appendChild(empty);
          return;
        }

        paddocks.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';

          const name = document.createElement('h3');
          name.textContent = p.name;

          const stat = document.createElement('p');
          stat.className = 'stat';
          stat.textContent = `${p.animal_count} / ${p.capacity} animals`;

          const capacityBar = document.createElement('div');
          capacityBar.className = 'capacity-bar';
          const capacityFill = document.createElement('div');
          capacityFill.className = 'capacity-fill';
          capacityFill.style.width = `${Math.min(100, Math.round((p.animal_count / p.capacity) * 100))}%`;
          capacityBar.appendChild(capacityFill);

          card.append(name, stat, capacityBar);
          grid.appendChild(card);
        });
      } catch (err) {
        grid.replaceChildren();
        const error = document.createElement('p');
        error.className = 'error';
        error.textContent = 'Unable to load paddocks. Please try again.';
        grid.appendChild(error);
      }
    }

    loadPaddocks();
  </script>
</body>
</html>
